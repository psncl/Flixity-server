schema: spec-driven

context: |
  Fixed constraints: Postgres with EF Core on .NET 10; API on a single Azure App Service instance.
  LLM access must stay provider-switchable; start with OpenAI's cheapest suitable GPT-6 model.
  Learning project with low traffic: prefer simple choices and keep running costs low.
  The owner is a junior .NET developer: explain non-obvious tradeoffs briefly.
  Use the domain terms in GLOSSARY.md. Regions and landscapes are not Cities.
  Automated tests use xUnit and FluentAssertions and never call real external APIs.
  Out of scope: user accounts, favourites, admin UI, frontend implementation, CI/CD pipelines.

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules: constraints applied when writing that artifact.
rules:
  tasks:
    - Each task ends with the build green and its tests passing, and is small enough for one commit

# Per-operation guidance: advisory, for how apply and archive work is done.
operations:
  apply:
    guidance:
      - After each task, run the unit tests, plus the integration tests if the task touched the database or an endpoint, then commit before starting the next task
  archive:
    guidance:
      - Before archiving, offer the user a /code-review of the branch
      - When archiving, update CLAUDE.md to match the code - mark the change done under Planning, and update Current state, Stack, Structure and the "Planned, not yet in code" list
